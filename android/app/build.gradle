apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"


def goModuleDir = file("../../shared/go")
def goBuildDir = layout.buildDirectory.dir("go").get().asFile

def goTargets = [
    "arm64-v8a"  : [goarch: "arm64", triple: "aarch64-linux-android"],
    "armeabi-v7a": [goarch: "arm",   triple: "armv7a-linux-androideabi"],
    "x86"        : [goarch: "386",   triple: "i686-linux-android"],
    "x86_64"     : [goarch: "amd64", triple: "x86_64-linux-android"],
]

// Keep the Go build in sync with whatever ABIs React Native is building.
def enabledAbis = (findProperty("reactNativeArchitectures")
        ?: "armeabi-v7a,arm64-v8a,x86,x86_64").split(",")*.trim()

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.recoverychat"
    defaultConfig {
        applicationId "com.recoverychat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                // Tells CMake where the per-ABI Go shared libraries live.
                // In AGP 9 this lives on the flavor, not on android.externalNativeBuild.
                arguments "-DGO_LIB_DIR=${goBuildDir.absolutePath}"
            }
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Caution! In production, you need to generate your own keystore file.
            // see https://reactnative.dev/docs/signed-apk-android.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }

    sourceSets {
        main {
            // build/go/<abi>/libchat.so has the layout jniLibs expects.
            jniLibs.srcDirs += goBuildDir
        }
    }
}


def minSdk = rootProject.ext.has("minSdkVersion") ? rootProject.ext.minSdkVersion : 24

def ndkDir = android.ndkDirectory
if (ndkDir == null || !ndkDir.isDirectory()) {
    def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    if (sdkDir != null) {
        ndkDir = new File(sdkDir, "ndk/${android.ndkVersion}")
    }
}
if (ndkDir == null || !ndkDir.isDirectory()) {
    throw new GradleException(
            "Android NDK not found. Install ndkVersion ${android.ndkVersion} " +
            "or set ANDROID_HOME / ANDROID_SDK_ROOT.")
}

def osName = System.getProperty("os.name").toLowerCase()
def hostTag = osName.contains("mac") ? "darwin-x86_64"
        : osName.contains("windows") ? "windows-x86_64"
        : "linux-x86_64"

// Android Studio's Gradle daemon often does not inherit the shell PATH, so look
// in the usual Go install locations before falling back to `go` on PATH.
// Override with -PgoBin=/path/to/go.
def goBin = findProperty("goBin")
if (!goBin) {
    def userHome = System.getProperty("user.home")
    def candidates = []
    def goroot = System.getenv("GOROOT")
    if (goroot) {
        candidates << "${goroot}/bin/go"
    }
    if (userHome) {
        candidates << "${userHome}/.local/go/bin/go"
        candidates << "${userHome}/go/bin/go"
        candidates << "${userHome}/sdk/go/bin/go"
    }
    candidates << "/usr/local/go/bin/go"
    candidates << "/opt/homebrew/bin/go"
    goBin = candidates.find { new File(it).canExecute() } ?: "go"
}

def goTasks = enabledAbis.collect { abi ->
    def target = goTargets[abi]
    if (target == null) {
        throw new GradleException("No Go toolchain mapping for ABI '${abi}'")
    }

    def outDir = new File(goBuildDir, abi)
    def clang = new File(ndkDir,
            "toolchains/llvm/prebuilt/${hostTag}/bin/" +
            "${target.triple}${minSdk}-clang")

    tasks.register("buildGo${abi.replace('-', '_')}", Exec) {
        group = "go"
        description = "Build shared/go as libchat.so for ${abi}"
        workingDir = goModuleDir

        environment "CGO_ENABLED", "1"
        environment "GOOS", "android"
        environment "GOARCH", target.goarch
        environment "CC", clang.absolutePath
        environment "CGO_CFLAGS", "-O2"
        environment "CGO_LDFLAGS", "-Wl,-z,max-page-size=16384"

        commandLine goBin, "build",
                "-buildmode=c-shared",
                "-trimpath",
                "-ldflags=-s -w -extldflags=-Wl,-soname,libchat.so",
                "-o", new File(outDir, "libchat.so").absolutePath,
                "."

        doFirst { outDir.mkdirs() }

        inputs.files(fileTree(goModuleDir) {
            include "**/*.go", "go.mod", "go.sum"
        })
        outputs.file(new File(outDir, "libchat.so"))
        outputs.file(new File(outDir, "libchat.h"))
    }
}

tasks.matching { it.name == "preBuild" }.configureEach {
    dependsOn goTasks
}
tasks.configureEach { t ->
    if (t.name.startsWith("configureCMake")
            || t.name.startsWith("buildCMake")
            || t.name.contains("JniLibFolders")
            || t.name.contains("NativeLibs")) {
        t.dependsOn goTasks
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
